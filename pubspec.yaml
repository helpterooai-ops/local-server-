name: pocket_cloud_host
description: "منصة استضافة سحابية لامركزية متكاملة - حول هاتفك إلى خادم سحابي شخصي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # أيقونات
  cupertino_icons: ^1.0.8

  # الخادم المحلي (Core HTTP Server)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  
  # بوتات تيليجرام
  teledart: ^0.6.1
  
  # نظام الملفات والتخزين
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  permission_handler: ^11.3.1
  
  # محرر الأكواد المتقدم
  flutter_code_editor: ^0.3.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  
  # التعامل مع HTML و CSS
  flutter_html: ^3.0.0-beta.2

  # التعامل مع الصور والوسائط
  image_picker: ^1.1.2
  video_player: ^2.8.6

  # الأنفاق الحية (Live Tunnels)
  # سنستخدم إضافات مخصصة لاحقًا
  http: ^1.2.1
  web_socket_channel: ^2.4.5

  # نظام الخلفية (Background Services)
  flutter_background_service: ^5.0.6
  flutter_local_notifications: ^17.2.3

  # إدارة المؤقتات (Self-Destruct Timers)
  cron: ^0.6.1

  # تخزين محلي
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # تشفير
  encrypt: ^5.0.3

  # مشاركة الملفات
  share_plus: ^9.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # سنضيف الأصول لاحقًا حسب الحاجة
  # assets:
  #   - assets/